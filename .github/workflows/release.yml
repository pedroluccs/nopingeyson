# Gera o NoPingeyson.exe e o instalador e publica na aba Releases quando uma
# tag v* é enviada (ex.: git tag v0.2.0 && git push origin v0.2.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Testes (protocolo e filtros do WinDivert)
        run: python -m unittest -v tests.test_local.ProtocolTests tests.test_local.FilterTests

      # os testes de ponta a ponta dependem de tempo (sondas, retenção de 1,5 s)
      # e podem oscilar em máquinas compartilhadas do GitHub: rodam, mas não travam o release
      - name: Testes de ponta a ponta (loopback)
        continue-on-error: true
        run: python -m unittest -v tests.test_local.EndToEnd tests.test_local.ProfileTests

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build (.exe + instalador)
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NoPingeyson ${{ github.ref_name }}
          files: build/installer/*.exe
          body: |
            Baixe **NoPingeyson-Setup-*-x64.exe**, rode e siga o instalador.
            O NoPingeyson pede permissão de Administrador ao abrir (necessário para desviar o tráfego dos jogos).
            Para as rotas funcionarem você precisa de servidores (relays) próprios; veja o README.